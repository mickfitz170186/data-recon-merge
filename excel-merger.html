<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Merger Tool</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
        #root {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Lucide React icons as inline SVG components
        const Download = ({ size = 24, ...props }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
        );

        const Plus = ({ size = 24, ...props }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
        );

        const X = ({ size = 24, ...props }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        );

        const FileSpreadsheet = ({ size = 24, ...props }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
                <polyline points="10 9 9 9 8 9" />
            </svg>
        );

        const ArrowRight = ({ size = 24, ...props }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                <line x1="5" y1="12" x2="19" y2="12" />
                <polyline points="12 5 19 12 12 19" />
            </svg>
        );

        function ExcelMerger() {
          const [step, setStep] = useState(1);
          const [file1, setFile1] = useState(null);
          const [file2, setFile2] = useState(null);
          const [sheets1, setSheets1] = useState([]);
          const [sheets2, setSheets2] = useState([]);
          const [selectedSheet1, setSelectedSheet1] = useState('');
          const [selectedSheet2, setSelectedSheet2] = useState('');
          const [data1, setData1] = useState([]);
          const [data2, setData2] = useState([]);
          const [columns1, setColumns1] = useState([]);
          const [columns2, setColumns2] = useState([]);
          const [mergeKeys, setMergeKeys] = useState([{ col1: '', col2: '', isDate: false }]);
          const [valueDecodings, setValueDecodings] = useState([]);
          const [mergedData, setMergedData] = useState(null);
          const [debugInfo, setDebugInfo] = useState(null);
          const [dragOver, setDragOver] = useState({ file1: false, file2: false });

          const processFile = (file, fileNum) => {
            const reader = new FileReader();
            reader.onload = (event) => {
              const workbook = XLSX.read(event.target.result, { type: 'binary' });
              const sheetNames = workbook.SheetNames;
              
              if (fileNum === 1) {
                setFile1(file);
                setSheets1(sheetNames);
                setSelectedSheet1(sheetNames[0]);
                loadSheetData(workbook, sheetNames[0], 1);
              } else {
                setFile2(file);
                setSheets2(sheetNames);
                setSelectedSheet2(sheetNames[0]);
                loadSheetData(workbook, sheetNames[0], 2);
              }
            };
            reader.readAsBinaryString(file);
          };

          const handleFileUpload = (e, fileNum) => {
            const file = e.target.files[0];
            if (!file) return;
            processFile(file, fileNum);
          };

          const handleDragOver = (e, fileNum) => {
            e.preventDefault();
            e.stopPropagation();
            setDragOver(prev => ({ ...prev, [`file${fileNum}`]: true }));
          };

          const handleDragLeave = (e, fileNum) => {
            e.preventDefault();
            e.stopPropagation();
            setDragOver(prev => ({ ...prev, [`file${fileNum}`]: false }));
          };

          const handleDrop = (e, fileNum) => {
            e.preventDefault();
            e.stopPropagation();
            setDragOver(prev => ({ ...prev, [`file${fileNum}`]: false }));
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
              const file = files[0];
              if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls') || file.name.endsWith('.csv')) {
                processFile(file, fileNum);
              }
            }
          };

          const loadSheetData = (workbook, sheetName, fileNum) => {
            const sheet = workbook.Sheets[sheetName];
            const jsonData = XLSX.utils.sheet_to_json(sheet, { defval: '' });
            const cols = jsonData.length > 0 ? Object.keys(jsonData[0]) : [];
            
            if (fileNum === 1) {
              setData1(jsonData);
              setColumns1(cols);
            } else {
              setData2(jsonData);
              setColumns2(cols);
            }
          };

          const handleSheetChange = (sheetName, fileNum) => {
            const reader = new FileReader();
            const file = fileNum === 1 ? file1 : file2;
            
            reader.onload = (event) => {
              const workbook = XLSX.read(event.target.result, { type: 'binary' });
              loadSheetData(workbook, sheetName, fileNum);
              if (fileNum === 1) setSelectedSheet1(sheetName);
              else setSelectedSheet2(sheetName);
            };
            reader.readAsBinaryString(file);
          };

          const addMergeKey = () => {
            setMergeKeys([...mergeKeys, { col1: '', col2: '', isDate: false }]);
          };

          const removeMergeKey = (index) => {
            setMergeKeys(mergeKeys.filter((_, i) => i !== index));
          };

          const updateMergeKey = (index, field, value) => {
            const updated = [...mergeKeys];
            updated[index][field] = value;
            setMergeKeys(updated);
          };

          const addDecoding = (keyIndex) => {
            setValueDecodings([...valueDecodings, { keyIndex, value1: '', value2: '' }]);
          };

          const removeDecoding = (index) => {
            setValueDecodings(valueDecodings.filter((_, i) => i !== index));
          };

          const updateDecoding = (index, field, value) => {
            const updated = [...valueDecodings];
            updated[index][field] = value;
            setValueDecodings(updated);
          };

          const performMerge = () => {
            const normalizeDate = (value) => {
              if (!value) return null;
              
              let date = null;
              
              if (typeof value === 'number') {
                const excelEpoch = new Date(1899, 11, 30);
                date = new Date(excelEpoch.getTime() + value * 86400000);
              } else {
                const str = String(value).trim();
                date = new Date(str);
                
                if (isNaN(date.getTime())) {
                  const compactMatch = str.match(/(\d{1,2})([A-Za-z]{3})(\d{4})/);
                  if (compactMatch) {
                    const [, day, month, year] = compactMatch;
                    const monthMap = {
                      jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5,
                      jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11
                    };
                    const monthNum = monthMap[month.toLowerCase()];
                    if (monthNum !== undefined) {
                      date = new Date(parseInt(year), monthNum, parseInt(day));
                    }
                  }
                }
              }
              
              if (date && !isNaN(date.getTime())) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
              }
              
              return null;
            };

            const normalizeValue = (value) => {
              const normalized = normalizeDate(value);
              if (normalized) return normalized;
              return String(value).toLowerCase().trim();
            };

            const applyDecodings = (value, keyIndex) => {
              const relevantDecodings = valueDecodings.filter(d => d.keyIndex === keyIndex);
              const valueStr = String(value).trim().toLowerCase();
              
              for (const decoding of relevantDecodings) {
                const val1 = String(decoding.value1).trim().toLowerCase();
                const val2 = String(decoding.value2).trim().toLowerCase();
                
                if (valueStr === val1 || valueStr === val2) {
                  return decoding.value1;
                }
              }
              return value;
            };

            const createKey = (row, cols, decodings = false, harmonizedValues = {}) => {
              return cols.map((keyPair, idx) => {
                const colName = keyPair.col1 || keyPair.col2;
                const value = row[colName];
                
                if (value === undefined || value === null || value === '') {
                  return '';
                }
                
                const processedValue = decodings ? applyDecodings(value, idx) : value;
                
                if (keyPair.isDate) {
                  const normalized = normalizeValue(processedValue);
                  const normalizedDate = normalizeDate(processedValue);
                  if (decodings) {
                    harmonizedValues[`_merge_key_${idx + 1}`] = normalizedDate || processedValue;
                  }
                  return normalized;
                } else {
                  const normalized = String(processedValue).toLowerCase().trim();
                  if (decodings) {
                    harmonizedValues[`_merge_key_${idx + 1}`] = processedValue;
                  }
                  return normalized;
                }
              }).join('|||');
            };

            const map1 = new Map();
            const map2 = new Map();
            const sampleKeys1 = [];
            const sampleKeys2 = [];

            data1.forEach((row, idx) => {
              const harmonizedValues = {};
              const key = createKey(row, mergeKeys.map(k => ({ col1: k.col1, col2: '', isDate: k.isDate })), true, harmonizedValues);
              if (!map1.has(key)) map1.set(key, []);
              map1.get(key).push({ ...row, ...harmonizedValues });
              if (idx < 3) {
                const originalVals = mergeKeys.map(k => row[k.col1]);
                sampleKeys1.push({ key, row: { ...row, ...harmonizedValues }, originalValues: originalVals });
              }
            });

            data2.forEach((row, idx) => {
              const harmonizedValues = {};
              const key = createKey(row, mergeKeys.map(k => ({ col1: '', col2: k.col2, isDate: k.isDate })), true, harmonizedValues);
              if (!map2.has(key)) map2.set(key, []);
              map2.get(key).push({ ...row, ...harmonizedValues });
              if (idx < 3) {
                const originalVals = mergeKeys.map(k => row[k.col2]);
                sampleKeys2.push({ key, row: { ...row, ...harmonizedValues }, originalValues: originalVals });
              }
            });

            const merged = [];
            const processedKeys = new Set();
            
            const file1Columns = new Set(columns1);
            const file2Columns = new Set(columns2);

            map1.forEach((rows1, key) => {
              const rows2 = map2.get(key) || [];
              rows1.forEach(row1 => {
                rows2.forEach(row2 => {
                  merged.push({ ...row1, ...row2, _source: 'Both' });
                });
                if (rows2.length === 0) {
                  merged.push({ ...row1, _source: 'File 1 Only' });
                }
              });
              processedKeys.add(key);
            });

            map2.forEach((rows2, key) => {
              if (!processedKeys.has(key)) {
                rows2.forEach(row2 => {
                  merged.push({ ...row2, _source: 'File 2 Only' });
                });
              }
            });

            setMergedData(merged);
            setDebugInfo({ sampleKeys1, sampleKeys2, file1Columns: Array.from(file1Columns), file2Columns: Array.from(file2Columns) });
            setStep(4);
          };

          const downloadMergedFile = async () => {
            if (!mergedData) return;

            const sorted = [...mergedData].sort((a, b) => {
              for (let i = 1; i <= mergeKeys.length; i++) {
                const keyCol = `_merge_key_${i}`;
                const aVal = String(a[keyCol] || '');
                const bVal = String(b[keyCol] || '');
                if (aVal < bVal) return -1;
                if (aVal > bVal) return 1;
              }
              return 0;
            });

            const orderedData = sorted.map(row => {
              const { _source, ...rest } = row;
              
              const mergeKeyCols = {};
              const regularCols = {};
              
              Object.keys(rest).forEach(key => {
                if (key.startsWith('_merge_key_')) {
                  mergeKeyCols[key] = rest[key];
                } else {
                  regularCols[key] = rest[key];
                }
              });
              
              return { 
                ...regularCols, 
                ...Object.fromEntries(
                  Object.entries(mergeKeyCols).map(([k, v]) => [
                    `Merge Key ${k.replace('_merge_key_', '')}`, 
                    v
                  ])
                ),
                'Merge Source': _source 
              };
            });

            const worksheet = XLSX.utils.json_to_sheet(orderedData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, 'Merged Data');
            
            XLSX.writeFile(workbook, 'merged_output.xlsx');
          };

          return (
            <div style={{
              minHeight: '100vh',
              background: 'linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%)',
              fontFamily: '"IBM Plex Mono", "Courier New", monospace',
              color: '#e2e8f0',
              padding: '2rem'
            }}>
              <div style={{
                maxWidth: '1200px',
                margin: '0 auto'
              }}>
                <header style={{
                  marginBottom: '3rem',
                  textAlign: 'center'
                }}>
                  <h1 style={{
                    fontSize: '2.5rem',
                    fontWeight: '700',
                    margin: '0 0 0.5rem 0',
                    background: 'linear-gradient(90deg, #60a5fa, #34d399)',
                    WebkitBackgroundClip: 'text',
                    WebkitTextFillColor: 'transparent',
                    letterSpacing: '-0.02em'
                  }}>
                    Excel Merger
                  </h1>
                  <p style={{
                    color: '#94a3b8',
                    fontSize: '0.875rem',
                    margin: 0,
                    letterSpacing: '0.1em',
                    textTransform: 'uppercase'
                  }}>
                    Merge · Transform · Export
                  </p>
                </header>

                <div style={{
                  display: 'flex',
                  justifyContent: 'center',
                  marginBottom: '2rem',
                  gap: '0.5rem'
                }}>
                  {[1, 2, 3, 4].map(num => (
                    <div key={num} style={{
                      width: '2.5rem',
                      height: '2.5rem',
                      borderRadius: '50%',
                      background: step >= num ? 'linear-gradient(135deg, #3b82f6, #2563eb)' : '#1e293b',
                      border: step === num ? '2px solid #60a5fa' : '2px solid #334155',
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      fontSize: '0.875rem',
                      fontWeight: '600',
                      transition: 'all 0.3s ease'
                    }}>
                      {num}
                    </div>
                  ))}
                </div>

                {step === 1 && (
                  <div style={{
                    background: 'rgba(15, 23, 42, 0.6)',
                    backdropFilter: 'blur(10px)',
                    borderRadius: '1rem',
                    border: '1px solid rgba(148, 163, 184, 0.2)',
                    padding: '2rem',
                    boxShadow: '0 20px 40px rgba(0, 0, 0, 0.4)'
                  }}>
                    <h2 style={{
                      fontSize: '1.5rem',
                      marginBottom: '1.5rem',
                      color: '#f1f5f9'
                    }}>
                      Step 1: Upload Files & Select Sheets
                    </h2>
                    
                    <div style={{
                      display: 'grid',
                      gridTemplateColumns: '1fr 1fr',
                      gap: '2rem'
                    }}>
                      {[1, 2].map(fileNum => (
                        <div 
                          key={fileNum} 
                          style={{
                            background: 'rgba(30, 41, 59, 0.5)',
                            border: '2px dashed ' + (
                              dragOver[`file${fileNum}`] ? '#60a5fa' :
                              fileNum === 1 ? (file1 ? '#34d399' : '#475569') : 
                              (file2 ? '#34d399' : '#475569')
                            ),
                            borderRadius: '0.75rem',
                            padding: '2rem',
                            textAlign: 'center',
                            transition: 'all 0.3s ease',
                            cursor: 'pointer',
                            transform: dragOver[`file${fileNum}`] ? 'scale(1.02)' : 'scale(1)'
                          }}
                          onDragOver={(e) => handleDragOver(e, fileNum)}
                          onDragLeave={(e) => handleDragLeave(e, fileNum)}
                          onDrop={(e) => handleDrop(e, fileNum)}
                        >
                          <input
                            type="file"
                            accept=".xlsx,.xls,.csv"
                            onChange={(e) => handleFileUpload(e, fileNum)}
                            style={{ display: 'none' }}
                            id={`file${fileNum}`}
                          />
                          <label htmlFor={`file${fileNum}`} style={{ cursor: 'pointer', display: 'block' }}>
                            <FileSpreadsheet size={48} style={{ margin: '0 auto 1rem', color: '#60a5fa' }} />
                            <div style={{ fontSize: '1.125rem', fontWeight: '600', marginBottom: '0.5rem' }}>
                              File {fileNum}
                            </div>
                            {(fileNum === 1 ? file1 : file2) ? (
                              <>
                                <div style={{ color: '#34d399', fontSize: '0.875rem', marginBottom: '1rem' }}>
                                  ✓ {(fileNum === 1 ? file1.name : file2.name)}
                                </div>
                                <select
                                  value={fileNum === 1 ? selectedSheet1 : selectedSheet2}
                                  onChange={(e) => handleSheetChange(e.target.value, fileNum)}
                                  onClick={(e) => e.stopPropagation()}
                                  style={{
                                    width: '100%',
                                    padding: '0.75rem',
                                    background: '#0f172a',
                                    border: '1px solid #334155',
                                    borderRadius: '0.5rem',
                                    color: '#e2e8f0',
                                    fontSize: '0.875rem',
                                    fontFamily: 'inherit'
                                  }}
                                >
                                  {(fileNum === 1 ? sheets1 : sheets2).map(sheet => (
                                    <option key={sheet} value={sheet}>{sheet}</option>
                                  ))}
                                </select>
                              </>
                            ) : (
                              <div style={{ color: '#94a3b8', fontSize: '0.875rem' }}>
                                {dragOver[`file${fileNum}`] ? 'Drop file here' : 'Click or drag & drop Excel/CSV file'}
                              </div>
                            )}
                          </label>
                        </div>
                      ))}
                    </div>

                    <button
                      onClick={() => setStep(2)}
                      disabled={!file1 || !file2}
                      style={{
                        marginTop: '2rem',
                        width: '100%',
                        padding: '1rem',
                        background: file1 && file2 ? 'linear-gradient(135deg, #3b82f6, #2563eb)' : '#334155',
                        border: 'none',
                        borderRadius: '0.5rem',
                        color: '#fff',
                        fontSize: '1rem',
                        fontWeight: '600',
                        cursor: file1 && file2 ? 'pointer' : 'not-allowed',
                        transition: 'all 0.3s ease',
                        fontFamily: 'inherit'
                      }}
                    >
                      Continue to Merge Keys
                    </button>
                  </div>
                )}

                {step === 2 && (
                  <div style={{
                    background: 'rgba(15, 23, 42, 0.6)',
                    backdropFilter: 'blur(10px)',
                    borderRadius: '1rem',
                    border: '1px solid rgba(148, 163, 184, 0.2)',
                    padding: '2rem',
                    boxShadow: '0 20px 40px rgba(0, 0, 0, 0.4)'
                  }}>
                    <h2 style={{
                      fontSize: '1.5rem',
                      marginBottom: '1.5rem',
                      color: '#f1f5f9'
                    }}>
                      Step 2: Configure Merge Keys
                    </h2>

                    {mergeKeys.map((key, index) => (
                      <div key={index} style={{
                        background: 'rgba(30, 41, 59, 0.5)',
                        borderRadius: '0.75rem',
                        padding: '1.5rem',
                        marginBottom: '1rem',
                        border: '1px solid #334155'
                      }}>
                        <div style={{
                          display: 'flex',
                          justifyContent: 'space-between',
                          alignItems: 'center',
                          marginBottom: '1rem'
                        }}>
                          <span style={{ fontSize: '0.875rem', color: '#94a3b8', fontWeight: '600' }}>
                            Merge Key #{index + 1}
                          </span>
                          {mergeKeys.length > 1 && (
                            <button
                              onClick={() => removeMergeKey(index)}
                              style={{
                                background: 'transparent',
                                border: 'none',
                                color: '#ef4444',
                                cursor: 'pointer',
                                padding: '0.25rem'
                              }}
                            >
                              <X size={18} />
                            </button>
                          )}
                        </div>
                        
                        <div style={{
                          display: 'grid',
                          gridTemplateColumns: '1fr auto 1fr',
                          gap: '1rem',
                          alignItems: 'center',
                          marginBottom: '1rem'
                        }}>
                          <select
                            value={key.col1}
                            onChange={(e) => updateMergeKey(index, 'col1', e.target.value)}
                            style={{
                              padding: '0.75rem',
                              background: '#0f172a',
                              border: '1px solid #334155',
                              borderRadius: '0.5rem',
                              color: '#e2e8f0',
                              fontSize: '0.875rem',
                              fontFamily: 'inherit'
                            }}
                          >
                            <option value="">Select column from File 1</option>
                            {columns1.map(col => (
                              <option key={col} value={col}>{col}</option>
                            ))}
                          </select>
                          
                          <ArrowRight size={20} style={{ color: '#60a5fa' }} />
                          
                          <select
                            value={key.col2}
                            onChange={(e) => updateMergeKey(index, 'col2', e.target.value)}
                            style={{
                              padding: '0.75rem',
                              background: '#0f172a',
                              border: '1px solid #334155',
                              borderRadius: '0.5rem',
                              color: '#e2e8f0',
                              fontSize: '0.875rem',
                              fontFamily: 'inherit'
                            }}
                          >
                            <option value="">Select column from File 2</option>
                            {columns2.map(col => (
                              <option key={col} value={col}>{col}</option>
                            ))}
                          </select>
                        </div>
                        
                        <label style={{
                          display: 'flex',
                          alignItems: 'center',
                          gap: '0.5rem',
                          cursor: 'pointer',
                          fontSize: '0.875rem',
                          color: '#94a3b8'
                        }}>
                          <input
                            type="checkbox"
                            checked={key.isDate}
                            onChange={(e) => updateMergeKey(index, 'isDate', e.target.checked)}
                            style={{
                              width: '1rem',
                              height: '1rem',
                              cursor: 'pointer',
                              accentColor: '#3b82f6'
                            }}
                          />
                          This is a date column (match different date formats)
                        </label>
                      </div>
                    ))}

                    <button
                      onClick={addMergeKey}
                      style={{
                        display: 'flex',
                        alignItems: 'center',
                        gap: '0.5rem',
                        padding: '0.75rem 1rem',
                        background: 'rgba(59, 130, 246, 0.2)',
                        border: '1px solid #3b82f6',
                        borderRadius: '0.5rem',
                        color: '#60a5fa',
                        fontSize: '0.875rem',
                        fontWeight: '600',
                        cursor: 'pointer',
                        marginBottom: '2rem',
                        fontFamily: 'inherit',
                        transition: 'all 0.3s ease'
                      }}
                    >
                      <Plus size={18} />
                      Add Merge Key
                    </button>

                    <div style={{
                      display: 'flex',
                      gap: '1rem'
                    }}>
                      <button
                        onClick={() => setStep(1)}
                        style={{
                          flex: 1,
                          padding: '1rem',
                          background: '#334155',
                          border: 'none',
                          borderRadius: '0.5rem',
                          color: '#e2e8f0',
                          fontSize: '1rem',
                          fontWeight: '600',
                          cursor: 'pointer',
                          fontFamily: 'inherit'
                        }}
                      >
                        Back
                      </button>
                      <button
                        onClick={() => setStep(3)}
                        disabled={!mergeKeys.every(k => k.col1 && k.col2)}
                        style={{
                          flex: 1,
                          padding: '1rem',
                          background: mergeKeys.every(k => k.col1 && k.col2) ? 'linear-gradient(135deg, #3b82f6, #2563eb)' : '#334155',
                          border: 'none',
                          borderRadius: '0.5rem',
                          color: '#fff',
                          fontSize: '1rem',
                          fontWeight: '600',
                          cursor: mergeKeys.every(k => k.col1 && k.col2) ? 'pointer' : 'not-allowed',
                          fontFamily: 'inherit'
                        }}
                      >
                        Continue to Value Decoding
                      </button>
                    </div>
                  </div>
                )}

                {step === 3 && (
                  <div style={{
                    background: 'rgba(15, 23, 42, 0.6)',
                    backdropFilter: 'blur(10px)',
                    borderRadius: '1rem',
                    border: '1px solid rgba(148, 163, 184, 0.2)',
                    padding: '2rem',
                    boxShadow: '0 20px 40px rgba(0, 0, 0, 0.4)'
                  }}>
                    <h2 style={{
                      fontSize: '1.5rem',
                      marginBottom: '1.5rem',
                      color: '#f1f5f9'
                    }}>
                      Step 3: Value Decoding (Optional)
                    </h2>

                    <p style={{
                      color: '#94a3b8',
                      fontSize: '0.875rem',
                      marginBottom: '2rem'
                    }}>
                      Define value equivalencies for matching. For example, "Visit 1" in File 1 might equal "V1" in File 2.
                    </p>

                    {valueDecodings.map((decoding, index) => (
                      <div key={index} style={{
                        background: 'rgba(30, 41, 59, 0.5)',
                        borderRadius: '0.75rem',
                        padding: '1.5rem',
                        marginBottom: '1rem',
                        border: '1px solid #334155'
                      }}>
                        <div style={{
                          display: 'flex',
                          justifyContent: 'space-between',
                          alignItems: 'center',
                          marginBottom: '1rem'
                        }}>
                          <span style={{ fontSize: '0.875rem', color: '#94a3b8', fontWeight: '600' }}>
                            Decoding for Merge Key #{decoding.keyIndex + 1}
                          </span>
                          <button
                            onClick={() => removeDecoding(index)}
                            style={{
                              background: 'transparent',
                              border: 'none',
                              color: '#ef4444',
                              cursor: 'pointer',
                              padding: '0.25rem'
                            }}
                          >
                            <X size={18} />
                          </button>
                        </div>
                        
                        <div style={{
                          display: 'grid',
                          gridTemplateColumns: '1fr auto 1fr',
                          gap: '1rem',
                          alignItems: 'center'
                        }}>
                          <input
                            type="text"
                            value={decoding.value1}
                            onChange={(e) => updateDecoding(index, 'value1', e.target.value)}
                            placeholder="Value in File 1"
                            style={{
                              padding: '0.75rem',
                              background: '#0f172a',
                              border: '1px solid #334155',
                              borderRadius: '0.5rem',
                              color: '#e2e8f0',
                              fontSize: '0.875rem',
                              fontFamily: 'inherit'
                            }}
                          />
                          
                          <span style={{ color: '#60a5fa', fontSize: '0.875rem' }}>≡</span>
                          
                          <input
                            type="text"
                            value={decoding.value2}
                            onChange={(e) => updateDecoding(index, 'value2', e.target.value)}
                            placeholder="Value in File 2"
                            style={{
                              padding: '0.75rem',
                              background: '#0f172a',
                              border: '1px solid #334155',
                              borderRadius: '0.5rem',
                              color: '#e2e8f0',
                              fontSize: '0.875rem',
                              fontFamily: 'inherit'
                            }}
                          />
                        </div>
                      </div>
                    ))}

                    <div style={{ marginBottom: '2rem' }}>
                      {mergeKeys.map((key, index) => (
                        <button
                          key={index}
                          onClick={() => addDecoding(index)}
                          style={{
                            display: 'inline-flex',
                            alignItems: 'center',
                            gap: '0.5rem',
                            padding: '0.75rem 1rem',
                            background: 'rgba(59, 130, 246, 0.2)',
                            border: '1px solid #3b82f6',
                            borderRadius: '0.5rem',
                            color: '#60a5fa',
                            fontSize: '0.875rem',
                            fontWeight: '600',
                            cursor: 'pointer',
                            marginRight: '0.5rem',
                            marginBottom: '0.5rem',
                            fontFamily: 'inherit',
                            transition: 'all 0.3s ease'
                          }}
                        >
                          <Plus size={18} />
                          Add Decoding for Key #{index + 1}
                        </button>
                      ))}
                    </div>

                    <div style={{
                      display: 'flex',
                      gap: '1rem'
                    }}>
                      <button
                        onClick={() => setStep(2)}
                        style={{
                          flex: 1,
                          padding: '1rem',
                          background: '#334155',
                          border: 'none',
                          borderRadius: '0.5rem',
                          color: '#e2e8f0',
                          fontSize: '1rem',
                          fontWeight: '600',
                          cursor: 'pointer',
                          fontFamily: 'inherit'
                        }}
                      >
                        Back
                      </button>
                      <button
                        onClick={performMerge}
                        style={{
                          flex: 1,
                          padding: '1rem',
                          background: 'linear-gradient(135deg, #10b981, #059669)',
                          border: 'none',
                          borderRadius: '0.5rem',
                          color: '#fff',
                          fontSize: '1rem',
                          fontWeight: '600',
                          cursor: 'pointer',
                          fontFamily: 'inherit'
                        }}
                      >
                        Perform Merge
                      </button>
                    </div>
                  </div>
                )}

                {step === 4 && mergedData && (
                  <div style={{
                    background: 'rgba(15, 23, 42, 0.6)',
                    backdropFilter: 'blur(10px)',
                    borderRadius: '1rem',
                    border: '1px solid rgba(148, 163, 184, 0.2)',
                    padding: '2rem',
                    boxShadow: '0 20px 40px rgba(0, 0, 0, 0.4)'
                  }}>
                    <h2 style={{
                      fontSize: '1.5rem',
                      marginBottom: '1.5rem',
                      color: '#f1f5f9'
                    }}>
                      Step 4: Review & Download
                    </h2>

                    {debugInfo && (
                      <details style={{
                        background: 'rgba(30, 41, 59, 0.5)',
                        borderRadius: '0.75rem',
                        padding: '1rem',
                        marginBottom: '2rem',
                        border: '1px solid #334155'
                      }}>
                        <summary style={{
                          cursor: 'pointer',
                          fontSize: '0.875rem',
                          color: '#94a3b8',
                          fontWeight: '600',
                          marginBottom: '1rem'
                        }}>
                          🔍 Debug: View Sample Merge Keys (click to expand)
                        </summary>
                        <div style={{ fontSize: '0.75rem', fontFamily: 'monospace' }}>
                          <div style={{ marginBottom: '1rem' }}>
                            <div style={{ color: '#60a5fa', fontWeight: '600', marginBottom: '0.5rem' }}>
                              File 1 Sample Keys:
                            </div>
                            {debugInfo.sampleKeys1.map((item, idx) => (
                              <div key={idx} style={{ color: '#e2e8f0', marginBottom: '1rem', paddingLeft: '1rem', borderLeft: '2px solid #60a5fa' }}>
                                <div style={{ color: '#94a3b8', fontSize: '0.7rem' }}>Original values: [{item.originalValues.join(', ')}]</div>
                                <div style={{ color: '#34d399', marginTop: '0.25rem' }}>Encoded Key: {item.key}</div>
                              </div>
                            ))}
                          </div>
                          <div>
                            <div style={{ color: '#a78bfa', fontWeight: '600', marginBottom: '0.5rem' }}>
                              File 2 Sample Keys:
                            </div>
                            {debugInfo.sampleKeys2.map((item, idx) => (
                              <div key={idx} style={{ color: '#e2e8f0', marginBottom: '1rem', paddingLeft: '1rem', borderLeft: '2px solid #a78bfa' }}>
                                <div style={{ color: '#94a3b8', fontSize: '0.7rem' }}>Original values: [{item.originalValues.join(', ')}]</div>
                                <div style={{ color: '#34d399', marginTop: '0.25rem' }}>Encoded Key: {item.key}</div>
                              </div>
                            ))}
                          </div>
                        </div>
                      </details>
                    )}

                    <div style={{
                      display: 'grid',
                      gridTemplateColumns: '1fr 1fr 1fr',
                      gap: '1rem',
                      marginBottom: '2rem'
                    }}>
                      <div style={{
                        background: 'rgba(16, 185, 129, 0.1)',
                        border: '1px solid #10b981',
                        borderRadius: '0.75rem',
                        padding: '1.5rem',
                        textAlign: 'center'
                      }}>
                        <div style={{ fontSize: '2rem', fontWeight: '700', color: '#34d399', marginBottom: '0.5rem' }}>
                          {mergedData.filter(r => r._source === 'Both').length}
                        </div>
                        <div style={{ fontSize: '0.875rem', color: '#94a3b8' }}>Matched Rows</div>
                      </div>
                      
                      <div style={{
                        background: 'rgba(59, 130, 246, 0.1)',
                        border: '1px solid #3b82f6',
                        borderRadius: '0.75rem',
                        padding: '1.5rem',
                        textAlign: 'center'
                      }}>
                        <div style={{ fontSize: '2rem', fontWeight: '700', color: '#60a5fa', marginBottom: '0.5rem' }}>
                          {mergedData.filter(r => r._source === 'File 1 Only').length}
                        </div>
                        <div style={{ fontSize: '0.875rem', color: '#94a3b8' }}>File 1 Only</div>
                      </div>
                      
                      <div style={{
                        background: 'rgba(168, 85, 247, 0.1)',
                        border: '1px solid #a855f7',
                        borderRadius: '0.75rem',
                        padding: '1.5rem',
                        textAlign: 'center'
                      }}>
                        <div style={{ fontSize: '2rem', fontWeight: '700', color: '#a78bfa', marginBottom: '0.5rem' }}>
                          {mergedData.filter(r => r._source === 'File 2 Only').length}
                        </div>
                        <div style={{ fontSize: '0.875rem', color: '#94a3b8' }}>File 2 Only</div>
                      </div>
                    </div>

                    <div style={{
                      background: 'rgba(30, 41, 59, 0.5)',
                      borderRadius: '0.75rem',
                      padding: '1rem',
                      marginBottom: '2rem',
                      maxHeight: '400px',
                      overflow: 'auto',
                      border: '1px solid #334155'
                    }}>
                      <table style={{
                        width: '100%',
                        fontSize: '0.75rem',
                        borderCollapse: 'collapse'
                      }}>
                        <thead>
                          <tr style={{ borderBottom: '1px solid #334155' }}>
                            {mergedData.length > 0 && Object.keys(mergedData[0]).map(key => (
                              <th key={key} style={{
                                padding: '0.75rem',
                                textAlign: 'left',
                                color: '#94a3b8',
                                fontWeight: '600',
                                position: 'sticky',
                                top: 0,
                                background: '#1e293b'
                              }}>
                                {key === '_source' ? 'Merge Source' : key}
                              </th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {mergedData.slice(0, 100).map((row, index) => (
                            <tr key={index} style={{
                              borderBottom: '1px solid rgba(51, 65, 85, 0.5)'
                            }}>
                              {Object.entries(row).map(([key, value]) => (
                                <td key={key} style={{
                                  padding: '0.75rem',
                                  color: key === '_source' ? (
                                    value === 'Both' ? '#34d399' :
                                    value === 'File 1 Only' ? '#60a5fa' : '#a78bfa'
                                  ) : '#e2e8f0'
                                }}>
                                  {String(value)}
                                </td>
                              ))}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      {mergedData.length > 100 && (
                        <div style={{
                          textAlign: 'center',
                          padding: '1rem',
                          color: '#94a3b8',
                          fontSize: '0.75rem'
                        }}>
                          Showing first 100 rows of {mergedData.length}
                        </div>
                      )}
                    </div>

                    <div style={{
                      display: 'flex',
                      gap: '1rem'
                    }}>
                      <button
                        onClick={() => setStep(3)}
                        style={{
                          flex: 1,
                          padding: '1rem',
                          background: '#334155',
                          border: 'none',
                          borderRadius: '0.5rem',
                          color: '#e2e8f0',
                          fontSize: '1rem',
                          fontWeight: '600',
                          cursor: 'pointer',
                          fontFamily: 'inherit'
                        }}
                      >
                        Back
                      </button>
                      <button
                        onClick={downloadMergedFile}
                        style={{
                          flex: 1,
                          display: 'flex',
                          alignItems: 'center',
                          justifyContent: 'center',
                          gap: '0.5rem',
                          padding: '1rem',
                          background: 'linear-gradient(135deg, #10b981, #059669)',
                          border: 'none',
                          borderRadius: '0.5rem',
                          color: '#fff',
                          fontSize: '1rem',
                          fontWeight: '600',
                          cursor: 'pointer',
                          fontFamily: 'inherit'
                        }}
                      >
                        <Download size={20} />
                        Download Merged File
                      </button>
                    </div>
                    
                    <div style={{
                      marginTop: '2rem',
                      padding: '1rem',
                      background: 'rgba(59, 130, 246, 0.1)',
                      border: '1px solid #3b82f6',
                      borderRadius: '0.5rem',
                      fontSize: '0.875rem',
                      color: '#94a3b8'
                    }}>
                      <div style={{ color: '#60a5fa', fontWeight: '600', marginBottom: '0.5rem' }}>
                        💡 Note: Advanced Formatting
                      </div>
                      The Excel file includes sorted data with harmonized merge key columns. For additional formatting (table formatting and color-coded columns by source), you can use openpyxl in Python or manually format in Excel.
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        ReactDOM.render(<ExcelMerger />, document.getElementById('root'));
    </script>
</body>
</html>
